# RECONSTRUCTED from documented values — verify against $SPLUNK_HOME/etc/system/local/inputs.conf
# Splunk Enterprise, T5-Splunk 192.168.50.4 (Secure zone, VLAN 905). Runs non-root, so
# privileged UDP 514 is not used; each firewall gets its own high port and sourcetype.

[udp://5514]
index = firewall
sourcetype = pan:firewall
connection_host = ip

[udp://5515]
index = firewall
sourcetype = fortinet
connection_host = ip

[splunktcp://9997]
disabled = 0
