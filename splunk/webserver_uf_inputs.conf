# VERBATIM (WinEventLog stanzas) — Windows Universal Forwarder on Web1 (192.168.20.4) and Web2 (192.168.20.5)
# Written directly into inputs.conf because `splunk add monitor "WinEventLog://..."` fails
# with "Path must be a file or directory". Restart with `.\splunk.exe restart`
# (Restart-Service SplunkForwarder errored on these hosts).
# Forward-server: 192.168.50.4:9997

[WinEventLog://Security]
disabled = 0
index = wineventlog

[WinEventLog://System]
disabled = 0
index = wineventlog

[WinEventLog://Application]
disabled = 0
index = wineventlog
